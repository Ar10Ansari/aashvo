name: API CI

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'packages/contracts/**'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [master, main]
    paths:
      - 'apps/api/**'
      - 'packages/contracts/**'

jobs:
  api-quality-and-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_local_password_only
          POSTGRES_DB: aashvo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ci_user:ci_local_password_only@localhost:5432/aashvo_test
      DIRECT_URL: postgresql://ci_user:ci_local_password_only@localhost:5432/aashvo_test
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run contracts:build
      - name: Validate Prisma schema
        run: npm --workspace=apps/api run prisma:validate
      - name: Apply Prisma migrations & PostgreSQL constraints
        run: npm --workspace=apps/api exec prisma migrate deploy
      - run: npm --workspace=apps/api run prisma:generate
      - run: npm --workspace=apps/api run typecheck
      - run: npm run api:build
      - run: npm run api:test
