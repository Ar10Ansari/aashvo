# ====================================================================
# AASHVO STAGING BLUEPRINT (RENDER.COM)
# Target Service: aashvo-api-staging
# Environment: staging
# Dedicated Staging Configuration ONLY - Zero Production Resources
# ====================================================================

services:
  - type: web
    name: aashvo-api-staging
    runtime: node
    plan: free
    region: singapore
    branch: staging/mvp-fasttrack-candidate
    buildCommand: npm ci --include=dev && npm run contracts:build && npm --workspace=apps/api run prisma:generate && npm --workspace=apps/api run build
    preDeployCommand: npm --workspace=apps/api exec prisma migrate deploy
    startCommand: npm --workspace=apps/api run start
    healthCheckPath: /api/v1/health/live
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: staging
      - key: PORT
        value: 10000
      - key: LOG_LEVEL
        value: debug
      - key: ENABLE_SWAGGER
        value: "true"

      # Dedicated Staging PostgreSQL Database Credentials (sync: false)
      # DO NOT USE PRODUCTION DATABASE CREDENTIALS
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false

      # Dedicated Staging RSA-2048 JWT Keys (sync: false)
      - key: JWT_SIGNING_PRIVATE_KEY
        sync: false
      - key: JWT_SIGNING_PUBLIC_KEY
        sync: false
      - key: JWT_ISSUER
        value: https://api.staging.aashvo.in
      - key: JWT_AUDIENCE
        value: aashvo-clients
      - key: JWT_ACCESS_TTL_SECONDS
        value: 900
      - key: REFRESH_TOKEN_TTL_DAYS
        value: 30

      # Security & Cross-Domain Cookie Settings
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none

      # Allowed Origins: Exclusively AASHVO Vercel Preview / Staging Frontend
      - key: WEB_APP_URL
        value: https://aashvo-git-staging-mvp-fa-10591b-abdul-rehman-ansari-s-projects.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://aashvo-git-staging-mvp-fa-10591b-abdul-rehman-ansari-s-projects.vercel.app,https://aashvo-d5p98ri5p-abdul-rehman-ansari-s-projects.vercel.app

      # Reverse Proxy & Rate Limiting
      - key: TRUST_PROXY
        value: "1"
      - key: THROTTLE_TTL_MS
        value: 60000
      - key: THROTTLE_LIMIT
        value: 120

      # Storage Configuration
      # Defaults to local storage until owner provisions staging Cloudflare R2 / AWS S3 buckets
      - key: STORAGE_PROVIDER
        value: local
      - key: LOCAL_STORAGE_BASE_DIR
        value: ./scratch/storage
      - key: LOCAL_STORAGE_PUBLIC_BASE_URL
        value: https://aashvo-api-staging.onrender.com/assets

      # Optional Cloudflare R2 Staging Media Bucket (sync: false)
      - key: CLOUDFLARE_R2_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_R2_ACCESS_KEY_ID
        sync: false
      - key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_R2_BUCKET_NAME
        value: aashvo-staging-public
      - key: CLOUDFLARE_R2_PUBLIC_URL
        value: https://cdn.staging.aashvo.in

      # Optional AWS S3 Mumbai Staging Private Document Vault (sync: false)
      - key: AWS_REGION
        value: ap-south-1
      - key: AWS_S3_PRIVATE_BUCKET
        value: aashvo-staging-vault
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
